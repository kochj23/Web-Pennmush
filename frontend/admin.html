<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Pennmush Admin</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="header">
        <h1>Admin Dashboard</h1>
        <div class="header-info">
            <span id="admin-name"></span>
            <a href="./" class="back-link">&larr; Back to Game</a>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h2>Server Statistics</h2>
            <div id="server-stats">
                <div><span class="stat-value" id="stat-players">0</span><div class="stat-label">Players</div></div>
                <div class="stat-row"><span class="stat-value" id="stat-connected">0</span><div class="stat-label">Connected</div></div>
                <div class="stat-row"><span class="stat-value" id="stat-rooms">0</span><div class="stat-label">Rooms</div></div>
                <div class="stat-row"><span class="stat-value" id="stat-objects">0</span><div class="stat-label">Things + Exits</div></div>
            </div>
            <button class="action-button" id="refresh-stats">Refresh</button>
        </div>

        <div class="dashboard-card">
            <h2>AI Relay</h2>
            <div id="ai-status">Loading...</div>
        </div>

        <div class="dashboard-card wide-card">
            <h2>Accounts</h2>
            <table class="table">
                <thead><tr><th>#</th><th>Name</th><th>Status</th><th>Site account</th><th></th></tr></thead>
                <tbody id="accounts-table"><tr><td colspan="5">Loading...</td></tr></tbody>
            </table>
            <button class="action-button" id="refresh-accounts">Refresh</button>
        </div>
    </div>

    <script src="static/js/admin.js"></script>
</body>
</html>
