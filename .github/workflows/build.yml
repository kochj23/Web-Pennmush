name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Postgres binaries (integration tests start a private cluster)
      run: sudo apt-get update && sudo apt-get install -y postgresql && echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -n | tail -1)/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Tests
      run: python -m pytest -q
    - name: Dependency audit
      run: pip-audit -r requirements.txt
